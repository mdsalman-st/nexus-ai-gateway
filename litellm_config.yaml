model_list:
  # --- GROUP 1: NVIDIA (Bada Batch - 25 MCQ) ---
  - model_name: "nvidia-bulk"
    litellm_params:
      model: "nvidia_nim/meta/llama-3.1-405b-instruct" 
      api_key: os.environ/NVIDIA_NIM_API_KEY

  # --- GROUP 2: Backup Providers (Chote Batch - 10 MCQ) ---
  # 1. Groq (Fast)
  - model_name: "backup-small"
    litellm_params:
      model: "groq/openai/gpt-oss-120b"
      api_key: os.environ/GROQ_KEY

  # 2. Gemini (Smart)
  - model_name: "backup-small"
    litellm_params:
      model: "gemini/gemini-1.5-flash" # LiteLLM standard naming
      api_key: os.environ/GEMINI_KEY_1

  # 3. Cloudflare (Emergency Backup)
  - model_name: "backup-small"
    litellm_params:
      model: "cloudflare/@cf/meta/llama-3-8b-instruct"
      api_key: os.environ/CLOUDFLARE_API_KEY
      api_base: "https://api.cloudflare.com/client/v4/accounts/os.environ/CLOUDFLARE_ACCOUNT_ID/ai/v1"

litellm_settings:
  num_retries: 2
  # Agar Groq fail hua, toh LiteLLM khud Gemini try karega, phir Cloudflare
  fallbacks: [{"backup-small": ["backup-small"]}] 